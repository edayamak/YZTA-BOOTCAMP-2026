<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenticQA</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="top">
        <div>
          <h1>AgenticQA</h1>
          <p class="muted">Siteyi tarar · detay admin konsolunda</p>
        </div>
      </header>

      <p class="status" id="status">Mağaza sayfasında taramayı başlatabilirsin.</p>

      <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress-head">
          <span class="progress-dot" id="progressDot"></span>
          <span id="progressLabel">Tarama çalışıyor…</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <button id="analyzeBtn" class="primary" type="button">Siteyi Tara</button>

      <section class="result hidden" id="resultSection">
        <dl class="summary" id="summary">
          <div class="site-platform">
            <pre id="sitePlatformBlock">Site      -
Platform  -</pre>
          </div>
          <div>
            <dt>Sayfa</dt>
            <dd id="metricPageType">-</dd>
          </div>
          <div>
            <dt>Ön risk</dt>
            <dd id="metricRisk">-</dd>
          </div>
          <div class="data-pack-block">
            <dt>Paket</dt>
            <dd><pre id="dataPackBlock">-</pre></dd>
          </div>
          <div class="capture-id">
            <dt>Tarama ID</dt>
            <dd id="metricCaptureId">-</dd>
          </div>
        </dl>

        <p class="result-hint">Detay admin konsolunda.</p>

        <button id="adminBtn" class="primary" type="button">Admin konsolunda incele</button>
      </section>

      <p class="note">Kişisel veri toplanmaz. Popup kapatsan da tarama devam eder.</p>
    </main>

    <script src="lib/config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
